name: PSH Live Integration

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * 1"

jobs:
  live-rainfall:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run live rainfall integration checks
        env:
          SYNOPTIC_TOKEN: ${{ secrets.SYNOPTIC_TOKEN }}
        run: npm run test:live
